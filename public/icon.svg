<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#c2410c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="100" fill="#ffffff" />
  
  <!-- Shield outline and fill -->
  <g filter="url(#shadow)">
    <path d="M256 64 C350 64 416 100 416 100 C416 260 350 380 256 448 C162 380 96 260 96 100 C96 100 162 64 256 64 Z" fill="url(#shieldGrad)" />
  </g>

  <!-- Inner safety helmet / check symbol -->
  <path d="M220 286 L180 246 L152 274 L220 342 L360 202 L332 174 Z" fill="#ffffff" />
  
  <!-- Subtle safety badge accent -->
  <circle cx="256" cy="148" r="20" fill="#ffffff" opacity="0.9"/>
</svg>
